name: Release Windows build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Package
        shell: pwsh
        run: >
          Compress-Archive
          -LiteralPath "dist/音乐标签与云盘修复工具"
          -DestinationPath "MusicTagFixer-Windows-${{ github.ref_name }}.zip"
          -CompressionLevel Optimal

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "MusicTagFixer-Windows-${{ github.ref_name }}.zip"
          --generate-notes
          --title "MusicTagFixer ${{ github.ref_name }}"
