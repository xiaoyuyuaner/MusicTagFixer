name: Release Windows build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v0.1.0]')
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Package
        shell: pwsh
        run: >
          Compress-Archive
          -LiteralPath "dist/音乐标签与云盘修复工具"
          -DestinationPath "MusicTagFixer-Windows-${{ env.RELEASE_TAG }}.zip"
          -CompressionLevel Optimal

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ env.RELEASE_TAG }}"
          "MusicTagFixer-Windows-${{ env.RELEASE_TAG }}.zip"
          --target "${{ github.sha }}"
          --generate-notes
          --title "MusicTagFixer ${{ env.RELEASE_TAG }}"

